{% extends "base.html" %}
{% block title %}Anmelden — ezbudget{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Anmelden</h1><p>Mit deinem ezbudget-Login einloggen.</p></div></div>
<div class="sheet" style="max-width:380px">
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
    <div class="field"><p class="helptext" style="color:var(--alert)">Benutzername oder Passwort ist falsch.</p></div>
    {% endif %}
    <div class="field">
      <label for="id_username">Benutzername</label>
      <input type="text" id="id_username" name="username" required autofocus>
    </div>
    <div class="field">
      <label for="id_password">Passwort</label>
      <input type="password" id="id_password" name="password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Anmelden</button>
  </form>
  <p class="helptext" style="margin-top:14px">Noch kein Konto? <a href="{% url 'signup' %}">Jetzt registrieren</a></p>
</div>
{% endblock %}
